services:
  - type: web
    name: gomate-be
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: TRUST_PROXY_HOPS
        value: "1"
